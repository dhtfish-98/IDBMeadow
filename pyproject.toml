[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "IDBMeadow"
version = "1.0.2"
description = "Bounded offline IDB parsing and attributed python-idb research derivative"
readme = "项目文档/README.md"
requires-python = ">=3.9"
license = {file = "项目文档/LICENSE.txt"}
dependencies = ['six==1.17.0', 'hexdump==3.3', 'vivisect-vstruct-wb==1.0.3', 'cached-property==2.0.1', 'capstone==5.0.6']
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["checks"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "build==1.6.1", "setuptools==84.0.0", "wheel==0.48.0", "libcst==1.9.0"]

[tool.setuptools.data-files]
"share/IDBMeadow" = ["项目文档/README.md", "项目文档/ORIGIN.md", "项目文档/VALIDATION.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/NAME_AUDIT.json", "项目文档/CURRENT_VALIDATION.json"]

[tool.setuptools]
license-files = ["项目文档/LICENSE.txt"]
